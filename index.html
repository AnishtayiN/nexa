<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#090d16">
  <meta name="description" content="پخش زندهٔ شبکه‌های عمومی IPTV فارسی و کردی با پلی‌لیست‌های رایگان M3U">
  <title>نکسا | NEXA</title>

  <!-- Google Fonts: Vazirmatn -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

  <!-- Hls.js -->
  <script src="https://cdn.jsdelivr.net/npm/hls.js@1/dist/hls.min.js"></script>

  <style>
    :root {
      --bg-dark: #090d16;
      --bg-card: rgba(22, 29, 47, 0.85);
      --bg-card-hover: rgba(33, 44, 71, 0.95);
      --accent: #06b6d4;
      --accent-glow: rgba(6, 182, 212, 0.35);
      --accent-grad: linear-gradient(135deg, #06b6d4 0%, #3b82f6 100%);
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --border: rgba(255, 255, 255, 0.08);
      --danger: #ef4444;
      --success: #10b981;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Vazirmatn', sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      height: 100%;
      height: 100dvh;
      overflow: hidden;
      position: fixed;
      width: 100%;
    }

    body {
      background-color: var(--bg-dark);
      background-image: 
        radial-gradient(at 0% 0%, rgba(6, 182, 212, 0.12) 0px, transparent 50%),
        radial-gradient(at 100% 100%, rgba(59, 130, 246, 0.1) 0px, transparent 50%);
      color: var(--text);
      display: flex;
      flex-direction: column;
    }

    /* Header */
    header {
      background: rgba(15, 23, 42, 0.9);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      padding: 8px 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid var(--border);
      z-index: 50;
      flex-shrink: 0;
      gap: 8px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .brand-logo {
      width: 32px;
      height: 32px;
      background: var(--accent-grad);
      border-radius: 8px;
      display: grid;
      place-items: center;
      box-shadow: 0 0 12px var(--accent-glow);
    }

    .brand-logo svg {
      width: 18px;
      height: 18px;
      fill: #fff;
    }

    .brand-title {
      font-size: 1rem;
      font-weight: 800;
    }

    .header-controls {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .btn {
      background: var(--bg-card);
      color: var(--text);
      border: 1px solid var(--border);
      padding: 6px 12px;
      border-radius: 8px;
      font-size: 0.8rem;
      font-weight: 500;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      white-space: nowrap;
    }

    .btn:hover {
      background: var(--bg-card-hover);
    }

    .btn-primary {
      background: var(--accent-grad);
      color: #fff;
      border: none;
    }

    .input-field {
      background: rgba(10, 15, 29, 0.85);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 6px 10px;
      border-radius: 8px;
      font-size: 0.8rem;
      outline: none;
    }

    /* Container */
    .container {
      display: flex;
      flex: 1;
      min-height: 0;
      position: relative;
      overflow: hidden;
    }

    /* Video Player Area */
    .player-wrapper {
      flex: 3;
      display: flex;
      flex-direction: column;
      background: #000;
      position: relative;
      overflow: hidden;
      justify-content: center;
      min-height: 0;
    }

    video {
      width: 100%;
      height: 100%;
      object-fit: contain;
      background: #000;
    }

    /* Player Overlay (Auto retry & Manual retry) */
    .player-error-overlay {
      position: absolute;
      inset: 0;
      background: rgba(9, 13, 22, 0.9);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 14px;
      z-index: 20;
      color: var(--text);
      text-align: center;
      padding: 20px;
    }

    .player-error-overlay.active {
      display: flex;
    }

    /* Spinner */
    .spinner {
      width: 40px;
      height: 40px;
      border: 3px solid rgba(255, 255, 255, 0.1);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .error-icon {
      width: 48px;
      height: 48px;
      color: var(--danger);
    }

    .error-msg {
      font-size: 0.9rem;
      color: var(--text-muted);
      max-width: 80%;
      line-height: 1.6;
    }

    .retry-countdown-num {
      color: var(--accent);
      font-weight: 700;
      font-size: 1rem;
    }

    .btn-retry {
      background: var(--accent-grad);
      color: #fff;
      border: none;
      padding: 9px 22px;
      border-radius: 8px;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      box-shadow: 0 4px 14px var(--accent-glow);
      transition: transform 0.15s ease, opacity 0.15s ease;
    }

    .btn-retry:hover {
      opacity: 0.9;
    }

    .btn-retry:active {
      transform: scale(0.96);
    }

    .stream-overlay {
      position: absolute;
      top: 12px;
      right: 12px;
      display: flex;
      align-items: center;
      gap: 8px;
      background: rgba(15, 23, 42, 0.85);
      backdrop-filter: blur(10px);
      padding: 6px 12px;
      border-radius: 10px;
      border: 1px solid var(--border);
      z-index: 10;
      pointer-events: none;
      max-width: min(85%, calc(100% - 360px));
    }

    .stream-overlay span {
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      font-size: 0.8rem;
    }

    .quality-control {
      position: absolute;
      top: 12px;
      left: 12px;
      z-index: 11;
      display: flex;
      align-items: center;
      gap: 6px;
      max-width: calc(100% - 24px);
      padding: 5px 8px;
      color: var(--text);
      background: rgba(15, 23, 42, 0.9);
      border: 1px solid var(--border);
      border-radius: 10px;
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
    }

    .quality-control label {
      flex-shrink: 0;
      color: var(--text-muted);
      font-size: 0.72rem;
    }

    #quality-selector {
      width: 132px;
      max-width: 38vw;
      padding: 5px 7px;
      font-size: 0.72rem;
    }

    #quality-selector:disabled,
    #quality-selector[hidden] {
      display: none;
    }

    .quality-fixed {
      display: inline-flex;
      align-items: center;
      max-width: 118px;
      overflow: hidden;
      padding: 5px 8px;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: rgba(10, 15, 29, 0.85);
      color: var(--text-muted);
      font-size: 0.72rem;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .quality-fixed[hidden] {
      display: none;
    }

    .quality-hint {
      max-width: 140px;
      overflow: hidden;
      color: var(--text-muted);
      font-size: 0.65rem;
      line-height: 1.3;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--text-muted);
      flex-shrink: 0;
    }

    .status-dot.online {
      background: var(--success);
      box-shadow: 0 0 8px var(--success);
    }

    .status-dot.buffering {
      background: #f59e0b;
      animation: pulse 1s infinite;
    }

    .status-dot.error {
      background: var(--danger);
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.3; }
    }

    /* Sidebar / Channel List */
    .sidebar {
      flex: 1;
      max-width: 380px;
      min-width: 300px;
      background: rgba(15, 23, 42, 0.7);
      backdrop-filter: blur(20px);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      min-height: 0;
      height: 100%;
      overflow: hidden;
    }

    .search-panel {
      padding: 10px 12px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      border-bottom: 1px solid var(--border);
      background: rgba(15, 23, 42, 0.4);
      flex-shrink: 0;
    }

    .filter-tabs {
      display: flex;
      gap: 6px;
    }

    .tab-btn {
      flex: 1;
      padding: 6px 0;
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text-muted);
      border-radius: 8px;
      font-size: 0.75rem;
      font-weight: 500;
      cursor: pointer;
    }

    .tab-btn.active {
      background: var(--accent-grad);
      color: #fff;
      border-color: transparent;
    }

    .channel-list {
      list-style: none;
      flex: 1;
      min-height: 0;
      overflow-y: scroll;
      -webkit-overflow-scrolling: touch;
      touch-action: pan-y;
      overscroll-behavior-y: contain;
      padding: 8px;
    }

    .channel-list::-webkit-scrollbar {
      width: 4px;
    }
    .channel-list::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, 0.15);
      border-radius: 4px;
    }

    .channel-item {
      padding: 12px 14px;
      border-radius: 10px;
      margin-bottom: 6px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid transparent;
      transition: background 0.15s;
    }

    .channel-item:active {
      background: var(--bg-card-hover);
    }

    .channel-item:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
    }

    .channel-item.active {
      background: var(--bg-card-hover);
      border: 1px solid var(--accent);
      box-shadow: 0 4px 15px rgba(6, 182, 212, 0.15);
    }

    .channel-info {
      display: flex;
      flex-direction: column;
      gap: 3px;
      overflow: hidden;
      pointer-events: none;
    }

    .channel-title {
      font-size: 0.9rem;
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .channel-meta {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 0.72rem;
      color: var(--text-muted);
    }

    .badge {
      background: rgba(255, 255, 255, 0.08);
      padding: 1px 5px;
      border-radius: 4px;
      font-size: 0.65rem;
      font-weight: 600;
    }

    .badge-hd {
      color: var(--accent);
      border: 1px solid rgba(6, 182, 212, 0.3);
    }

    .channel-actions {
      display: flex;
      align-items: center;
      gap: 2px;
    }

    .icon-btn {
      background: none;
      border: none;
      cursor: pointer;
      color: var(--text-muted);
      padding: 8px;
      border-radius: 6px;
      display: grid;
      place-items: center;
    }

    .icon-btn.is-fav {
      color: #fbbf24;
    }

    /* Toast */
    .toast {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%) translateY(100px);
      background: rgba(15, 23, 42, 0.95);
      border: 1px solid var(--accent);
      color: var(--text);
      padding: 8px 18px;
      border-radius: 10px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.6);
      font-size: 0.8rem;
      opacity: 0;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      z-index: 100;
      pointer-events: none;
    }

    .toast.show {
      transform: translateX(-50%) translateY(0);
      opacity: 1;
    }

    .shortcuts-help {
      padding: 8px 14px;
      background: rgba(0,0,0,0.3);
      font-size: 0.7rem;
      color: var(--text-muted);
      border-top: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      flex-shrink: 0;
    }

    /* Responsive */
    @media (max-width: 850px) {
      .brand-title {
        display: none;
      }

      .container {
        flex-direction: column;
        flex: 1;
        min-height: 0;
      }

      .player-wrapper {
        flex: none;
        width: 100%;
        height: 220px;
        border-bottom: 2px solid var(--border);
      }

      .quality-control {
        top: 8px;
        left: 8px;
      }

      .stream-overlay {
        top: auto;
        right: 8px;
        bottom: 8px;
        left: 8px;
        max-width: none;
      }

      .sidebar {
        flex: 1;
        min-height: 0;
        max-width: 100%;
        min-width: 100%;
        border-right: none;
        height: auto;
      }

      .channel-list {
        flex: 1;
        min-height: 0;
      }

      .shortcuts-help {
        display: none;
      }
    }

    @media (max-width: 420px) {
      .player-wrapper {
        height: 190px;
      }
      #source-selector {
        max-width: 130px;
      }

      #quality-selector {
        width: 118px;
        max-width: 42vw;
      }

      .quality-hint {
        display: none;
      }

      .quality-control.is-fixed {
        gap: 0;
        padding: 3px 6px;
      }

      .quality-control.is-fixed label,
      .quality-control.is-fixed .quality-hint {
        display: none;
      }

      .quality-fixed {
        max-width: 102px;
        padding: 4px 6px;
        font-size: 0.68rem;
      }
    }
  </style>
</head>
<body>

  <div id="toast" class="toast">پیوند کپی شد!</div>

  <header>
    <div class="brand">
      <div class="brand-logo">
        <svg viewBox="0 0 24 24"><path d="M4 6h16v12H4z M2 4a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v16a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V4z M10 8.5v7l6-3.5z"/></svg>
      </div>
      <div class="brand-title">تلویزیون نِکسا</div>
    </div>

    <div class="header-controls">
      <select id="source-selector" class="input-field" aria-label="انتخاب پلی‌لیست">
        <option value="playlist_extended.m3u">گسترده: فارسی + کردی</option>
        <option value="playlist_extended_hd.m3u">گسترده HD</option>
        <option value="playlist_extended_sd.m3u">گسترده SD</option>
        <option value="playlist.m3u">فقط فارسی</option>
        <option value="playlist_hd.m3u">فقط فارسی HD</option>
        <option value="playlist_sd.m3u">فقط فارسی SD</option>
        <option value="custom">آدرس دلخواه...</option>
      </select>

      <input type="text" id="url-loader" class="input-field" placeholder="نشانی M3U..." style="display: none; width: 130px;">
      <button class="btn btn-primary" id="btn-load-url">بارگذاری</button>

      <label class="btn" for="file-loader" title="بارگذاری فایل از گوشی">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><path d="M9 16h6v-6h4l-7-7-7 7h4zm-4 2h14v2H5z"/></svg>
        فایل
      </label>
      <input type="file" id="file-loader" accept=".m3u,.m3u8" style="display: none;">
    </div>
  </header>

  <div class="container">
    <main class="player-wrapper">
      <div class="stream-overlay">
        <div id="status-indicator" class="status-dot"></div>
        <span id="now-playing-title">کانالی انتخاب نشده</span>
      </div>

      <div class="quality-control">
        <label for="quality-selector">کیفیت</label>
        <select id="quality-selector" class="input-field" disabled hidden aria-describedby="quality-hint">
          <option value="auto">خودکار</option>
        </select>
        <span id="quality-fixed" class="quality-fixed" role="note">در حال آماده‌سازی</span>
        <span id="quality-hint" class="quality-hint" role="status" aria-live="polite">در حال آماده‌سازی پخش‌کننده…</span>
      </div>

      <!-- Player Auto-Retry / Manual retry -->
      <div id="player-error-overlay" class="player-error-overlay">
        <!-- 1. Auto Retry View -->
        <div id="auto-retry-container" style="display: none; flex-direction: column; align-items: center; gap: 12px;">
          <div class="spinner"></div>
          <div class="error-msg">
            در حال تلاش برای اتصال مجدد...
            <br>
            (<span id="retry-countdown" class="retry-countdown-num">5</span> ثانیه)
          </div>
        </div>

        <!-- 2. Manual Retry View -->
        <div id="manual-retry-container" style="display: none; flex-direction: column; align-items: center; gap: 14px;">
          <svg class="error-icon" viewBox="0 0 24 24" fill="currentColor">
            <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-2h2v2zm0-4h-2V7h2v6z"/>
          </svg>
          <div id="error-message-text" class="error-msg">پخش استریم این شبکه با خطا مواجه شد.</div>
          <button id="btn-retry-stream" class="btn-retry">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
              <path d="M23 4v6h-6"></path>
              <path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"></path>
            </svg>
            تلاش مجدد
          </button>
        </div>
      </div>

      <video id="video-player" controls autoplay playsinline></video>
    </main>

    <aside class="sidebar">
      <div class="search-panel">
        <input type="text" id="search-box" class="input-field" placeholder="جستجوی کانال...">
        
        <div class="filter-tabs">
          <button class="tab-btn active" data-tab="all">همه</button>
          <button class="tab-btn" data-tab="favs">علاقه‌مندی‌ها ★</button>
          <button class="tab-btn" data-tab="hd">فقط HD</button>
        </div>

        <select id="group-filter" class="input-field">
          <option value="">همه دسته‌ها</option>
        </select>
      </div>

      <ul id="channel-list" class="channel-list"></ul>

      <div class="shortcuts-help">
        <span>میانبرها: <b>F</b> (تمام‌صفحه) | <b>M</b> (صدا)</span>
        <span><b>N</b> / <b>P</b> (کانال بعد/قبل)</span>
      </div>
    </aside>
  </div>

  <script>
    let channels = [];
    let currentChannelIdx = -1;
    let activeTab = 'all';
    let currentSourceUrl = '';
    let currentPlaybackEntry = null;
    let hls = null;
    let toastTimer = null;

    function readFavorites() {
      try {
        const value = JSON.parse(localStorage.getItem('iptv_favorites') || '[]');
        return Array.isArray(value) ? value.filter(item => typeof item === 'string') : [];
      } catch (_) {
        return [];
      }
    }

    let favorites = readFavorites();

    const RETRY_SECONDS = 5;
    let retryInterval = null;
    let isAutoRetrying = false;

    const video = document.getElementById('video-player');
    const channelListEl = document.getElementById('channel-list');
    const searchInput = document.getElementById('search-box');
    const groupFilter = document.getElementById('group-filter');
    const nowPlayingTitle = document.getElementById('now-playing-title');
    const statusIndicator = document.getElementById('status-indicator');
    const qualitySelector = document.getElementById('quality-selector');
    const qualityFixed = document.getElementById('quality-fixed');
    const qualityHint = document.getElementById('quality-hint');
    const qualityControl = document.querySelector('.quality-control');
    const sourceSelector = document.getElementById('source-selector');
    const urlLoader = document.getElementById('url-loader');
    const toast = document.getElementById('toast');
    const errorOverlay = document.getElementById('player-error-overlay');
    const autoRetryContainer = document.getElementById('auto-retry-container');
    const manualRetryContainer = document.getElementById('manual-retry-container');
    const retryCountdownEl = document.getElementById('retry-countdown');
    const errorMsgText = document.getElementById('error-message-text');
    const retryBtn = document.getElementById('btn-retry-stream');

    function showToast(message) {
      toast.textContent = message;
      toast.classList.add('show');
      if (toastTimer) clearTimeout(toastTimer);
      toastTimer = setTimeout(() => toast.classList.remove('show'), 2800);
    }

    function setStatus(state) {
      statusIndicator.className = `status-dot ${state}`;
    }

    function resetQualityControl(message, label = 'خودکار') {
      qualitySelector.replaceChildren();
      const option = document.createElement('option');
      option.value = 'auto';
      option.textContent = label;
      qualitySelector.appendChild(option);
      qualitySelector.value = 'auto';
      qualitySelector.disabled = true;
      qualitySelector.hidden = true;
      qualityFixed.hidden = false;
      qualityFixed.textContent = label;
      qualityFixed.title = message;
      qualityFixed.setAttribute('aria-label', `کیفیت: ${label}. ${message}`);
      qualityControl.classList.add('is-fixed');
      qualitySelector.title = message;
      qualityHint.textContent = message;
    }

    function showQualityMenu(message) {
      qualitySelector.disabled = false;
      qualitySelector.hidden = false;
      qualityFixed.hidden = true;
      qualityControl.classList.remove('is-fixed');
      qualitySelector.title = message;
      qualityHint.textContent = message;
    }

    function showFixedQuality(label, message) {
      qualitySelector.disabled = true;
      qualitySelector.hidden = true;
      qualityFixed.hidden = false;
      qualityFixed.textContent = label;
      qualityFixed.title = message;
      qualityFixed.setAttribute('aria-label', `کیفیت: ${label}. ${message}`);
      qualityControl.classList.add('is-fixed');
      qualitySelector.title = message;
      qualityHint.textContent = message;
    }

    function formatLevel(level) {
      const height = Number(level && level.height) || 0;
      const bitrate = Number(level && level.bitrate) || 0;
      const resolution = height ? `${height}p` : 'کیفیت نامشخص';
      let rate = '';
      if (bitrate >= 1000000) rate = `${(bitrate / 1000000).toFixed(1)} Mbps`;
      else if (bitrate > 0) rate = `${Math.round(bitrate / 1000)} kbps`;
      return rate ? `${resolution} · ${rate}` : resolution;
    }

    function currentQualityLabel(level, active) {
      if (Number(level && level.height) > 0) return formatLevel(level);
      const sourceQuality = String(active && active.quality || '').trim();
      if (sourceQuality && sourceQuality !== 'Unknown') return sourceQuality;
      if (Number(level && level.bitrate) > 0) return formatLevel(level);
      return 'نامشخص';
    }

    function sameChannel(first, second) {
      if (!first || !second) return false;
      if (first.id && second.id) return first.id.toLowerCase() === second.id.toLowerCase();
      const firstName = String(first.name || '').trim().toLowerCase();
      const secondName = String(second.name || '').trim().toLowerCase();
      return Boolean(firstName && firstName !== 'شبکه بدون نام' && firstName === secondName);
    }

    function getAlternateSources() {
      const active = currentPlaybackEntry || channels[currentChannelIdx];
      if (!active) return [];
      return channels
        .map((entry, index) => ({ entry, index }))
        .filter(item => sameChannel(item.entry, active) && item.entry.url !== active.url)
        .sort((a, b) => sourceQualityHeight(a.entry) - sourceQualityHeight(b.entry));
    }

    function sourceQualityHeight(entry) {
      const match = String(entry.quality || '').match(/(?:^|\D)(\d{3,4})\s*[pi]?(?:\D|$)/i);
      return match ? Number(match[1]) : (entry.isHD ? 720 : 0);
    }

    function sourceQualityLabel(entry) {
      const quality = entry.quality && entry.quality !== 'Unknown'
        ? entry.quality
        : (entry.isHD ? 'HD' : 'کیفیت نامشخص');
      let host = '';
      try { host = new URL(entry.url).hostname.replace(/^www\./i, ''); } catch (_) {}
      return host ? `${quality} · ${host}` : `${quality} · لینک جایگزین`;
    }

    function addAlternateSourceOptions(alternatives) {
      if (!alternatives.length) return;
      const group = document.createElement('optgroup');
      group.label = 'لینک‌های جایگزین همین شبکه';
      alternatives.forEach(({ entry, index }) => {
        const option = document.createElement('option');
        option.value = `source:${index}`;
        option.textContent = sourceQualityLabel(entry);
        group.appendChild(option);
      });
      qualitySelector.appendChild(group);
    }

    function updateQualityOptions(instance) {
      if (hls !== instance) return;
      const levels = Array.isArray(instance.levels) ? instance.levels : [];
      const alternatives = getAlternateSources();
      const active = currentPlaybackEntry || channels[currentChannelIdx];
      const previousValue = qualitySelector.value;

      qualitySelector.replaceChildren();
      const currentOption = document.createElement('option');
      currentOption.value = 'auto';
      currentOption.textContent = levels.length > 1
        ? 'خودکار'
        : `فعلی · ${currentQualityLabel(levels[0], active)}`;
      qualitySelector.appendChild(currentOption);

      if (levels.length > 1) {
        const group = document.createElement('optgroup');
        group.label = 'کیفیت‌های همین استریم';
        const sortedLevels = levels.map((level, index) => ({ level, index })).sort((a, b) => {
          const heightDifference = (Number(a.level.height) || 0) - (Number(b.level.height) || 0);
          if (heightDifference !== 0) return heightDifference;
          return (Number(a.level.bitrate) || 0) - (Number(b.level.bitrate) || 0);
        });
        sortedLevels.forEach(({ level, index }) => {
          const option = document.createElement('option');
          option.value = `level:${index}`;
          option.textContent = formatLevel(level);
          group.appendChild(option);
        });
        qualitySelector.appendChild(group);
      }
      addAlternateSourceOptions(alternatives);

      const canChange = levels.length > 1 || alternatives.length > 0;
      if (!canChange) {
        const fixedLabel = currentQualityLabel(levels[0], active);
        const message = `فقط ${fixedLabel} موجود است؛ کیفیت دیگری برای انتخاب نیست.`;
        showFixedQuality(`ثابت · ${fixedLabel}`, message);
        return;
      }

      const optionExists = [...qualitySelector.options].some(option => option.value === previousValue);
      qualitySelector.value = optionExists ? previousValue : 'auto';
      const message = levels.length > 1
        ? 'برای کاهش مصرف، رزولوشن پایین‌تر را انتخاب کن.'
        : 'این لینک کیفیت ثابت دارد؛ برای تغییر، یکی از لینک‌های جایگزین همین شبکه را انتخاب کن.';
      showQualityMenu(message);
    }

    function updateNativeQualityOptions() {
      const alternatives = getAlternateSources();
      const active = currentPlaybackEntry || channels[currentChannelIdx];
      qualitySelector.replaceChildren();
      const option = document.createElement('option');
      option.value = 'auto';
      option.textContent = `خودکار · ${active ? currentQualityLabel(null, active) : 'مرورگر'}`;
      qualitySelector.appendChild(option);
      addAlternateSourceOptions(alternatives);
      if (alternatives.length) {
        showQualityMenu('مرورگر کیفیت داخلی را خودکار تنظیم می‌کند؛ لینک جایگزین همین شبکه را هم می‌توانی انتخاب کنی.');
      } else {
        showFixedQuality('خودکار مرورگر', 'این مرورگر کیفیت را خودکار تنظیم می‌کند؛ تغییر دستی این استریم در دسترس نیست.');
      }
    }

    function updateCurrentQuality(instance, data) {
      if (hls !== instance || qualityControl.classList.contains('is-fixed') || !data || !Number.isInteger(Number(data.level))) return;
      const level = instance.levels && instance.levels[Number(data.level)];
      if (!level) return;
      const active = currentPlaybackEntry || channels[currentChannelIdx];
      const mode = qualitySelector.value === 'auto' ? 'خودکار' : 'دستی';
      qualityHint.textContent = `${mode}: اکنون ${currentQualityLabel(level, active)}`;
    }

    qualitySelector.addEventListener('change', () => {
      const value = qualitySelector.value;
      if (value.startsWith('source:')) {
        const sourceIndex = Number(value.slice('source:'.length));
        const alternative = channels[sourceIndex];
        const active = currentPlaybackEntry || channels[currentChannelIdx];
        if (Number.isInteger(sourceIndex) && alternative && sameChannel(alternative, active)) {
          playChannel(currentChannelIdx, true, alternative);
        }
        return;
      }
      if (qualitySelector.disabled) return;
      if (value === 'auto') {
        if (hls) {
          hls.autoLevelCapping = -1;
          hls.currentLevel = -1;
          qualityHint.textContent = 'کیفیت تطبیقی خودکار است؛ برای کاهش مصرف، رزولوشن پایین‌تری انتخاب کن.';
        }
        return;
      }
      if (!hls) return;
      const match = value.match(/^level:(\d+)$/);
      if (!match) return;
      const levelIndex = Number(match[1]);
      if (!Number.isInteger(levelIndex) || levelIndex < 0 || levelIndex >= hls.levels.length) return;
      hls.autoLevelCapping = -1;
      hls.currentLevel = levelIndex;
      qualityHint.textContent = `کیفیت دستی: ${formatLevel(hls.levels[levelIndex])}`;
    });

    function resolveHttpUrl(value, baseUrl = '') {
      const raw = String(value || '').trim();
      if (!raw) return '';
      try {
        const url = baseUrl ? new URL(raw, baseUrl) : new URL(raw);
        return (url.protocol === 'http:' || url.protocol === 'https:') ? url.href : '';
      } catch (_) {
        return '';
      }
    }

    function hideOverlays() {
      stopAutoRetry();
      errorOverlay.classList.remove('active');
      autoRetryContainer.style.display = 'none';
      manualRetryContainer.style.display = 'none';
    }

    function stopAutoRetry() {
      if (retryInterval) {
        clearInterval(retryInterval);
        retryInterval = null;
      }
      isAutoRetrying = false;
    }

    function startAutoRetryCountdown() {
      if (isAutoRetrying) return;
      isAutoRetrying = true;
      setStatus('buffering');
      errorOverlay.classList.add('active');
      autoRetryContainer.style.display = 'flex';
      manualRetryContainer.style.display = 'none';

      let secondsLeft = RETRY_SECONDS;
      retryCountdownEl.textContent = String(secondsLeft);
      retryInterval = setInterval(() => {
        secondsLeft -= 1;
        retryCountdownEl.textContent = String(Math.max(secondsLeft, 0));

        if (hls && secondsLeft > 0 && secondsLeft % 2 === 0) {
          try { hls.startLoad(); } catch (_) {}
        }
        if (secondsLeft <= 0) {
          stopAutoRetry();
          showManualRetry('پس از چند تلاش، اتصال برقرار نشد.');
        }
      }, 1000);
    }

    function showManualRetry(message) {
      stopAutoRetry();
      if (hls) {
        try { hls.destroy(); } catch (_) {}
        hls = null;
      }
      setStatus('error');
      errorMsgText.textContent = message || 'پخش زندهٔ این شبکه ممکن نیست.';
      errorOverlay.classList.add('active');
      autoRetryContainer.style.display = 'none';
      manualRetryContainer.style.display = 'flex';
    }

    function readAttribute(line, key) {
      const match = line.match(new RegExp(`(?:^|\\s)${key}="([^"]*)"`, 'i'));
      return match ? match[1] : '';
    }

    function isHighQuality(quality, name) {
      const value = `${quality || ''} ${name || ''}`;
      return /\b(?:uhd|hd|4k|8k)\b|(?:^|\D)(?:720|1080|1440|2160)\s*[pi]?(?:\D|$)/i.test(value);
    }

    function parseM3U(content, baseUrl = '') {
      const lines = String(content || '').replace(/^\uFEFF/, '').split(/\r?\n/);
      const list = [];
      let current = null;

      for (const rawLine of lines) {
        const line = rawLine.trim();
        if (!line) continue;

        if (line.startsWith('#EXTINF:')) {
          const comma = line.indexOf(',');
          const titlePart = comma >= 0 ? line.slice(comma + 1).trim() : '';
          const name = readAttribute(line, 'tvg-name') || titlePart || 'شبکه بدون نام';
          const quality = readAttribute(line, 'tvg-quality');
          current = {
            id: readAttribute(line, 'tvg-id'),
            name,
            group: readAttribute(line, 'group-title') || 'عمومی',
            language: readAttribute(line, 'tvg-language'),
            logo: readAttribute(line, 'tvg-logo'),
            quality,
            url: '',
            isHD: isHighQuality(quality, name)
          };
          continue;
        }

        if (line.startsWith('#') || !current) continue;
        const streamUrl = resolveHttpUrl(line, baseUrl);
        if (streamUrl) {
          current.url = streamUrl;
          list.push(current);
        }
        current = null;
      }
      return list;
    }

    function createSvgButton(kind, title, isFavorite = false) {
      const button = document.createElement('button');
      button.type = 'button';
      button.className = `icon-btn ${kind}-btn${isFavorite ? ' is-fav' : ''}`;
      button.title = title;
      button.setAttribute('aria-label', title);

      const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
      svg.setAttribute('width', kind === 'share' ? '15' : '16');
      svg.setAttribute('height', kind === 'share' ? '15' : '16');
      svg.setAttribute('viewBox', '0 0 24 24');
      if (kind === 'share') {
        svg.setAttribute('fill', 'none');
        svg.setAttribute('stroke', 'currentColor');
        svg.setAttribute('stroke-width', '2');
        [
          'M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71',
          'M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71'
        ].forEach(d => {
          const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
          path.setAttribute('d', d);
          svg.appendChild(path);
        });
      } else {
        svg.setAttribute('fill', 'currentColor');
        const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
        path.setAttribute('d', 'M12 17.27L18.18 21l-1.64-7.03L22 9.24l-7.19-.61L12 2 9.19 8.63 2 9.24l5.46 4.73L5.82 21z');
        svg.appendChild(path);
      }
      button.appendChild(svg);
      return button;
    }

    function renderChannels() {
      const query = searchInput.value.toLowerCase().trim();
      const selectedGroup = groupFilter.value;
      channelListEl.replaceChildren();

      const filtered = channels.filter(channel => {
        const searchable = `${channel.name} ${channel.id} ${channel.group} ${channel.language || ''}`.toLowerCase();
        const matchesQuery = searchable.includes(query);
        const matchesGroup = !selectedGroup || channel.group === selectedGroup;
        const isFavorite = favorites.includes(channel.id || channel.name);
        if (activeTab === 'favs' && !isFavorite) return false;
        if (activeTab === 'hd' && !channel.isHD) return false;
        return matchesQuery && matchesGroup;
      });

      if (filtered.length === 0) {
        const empty = document.createElement('li');
        empty.textContent = 'شبکه‌ای پیدا نشد';
        empty.style.cssText = 'text-align:center;padding:30px;color:var(--text-muted);font-size:.85rem';
        channelListEl.appendChild(empty);
        return;
      }

      filtered.forEach(channel => {
        const index = channels.indexOf(channel);
        const favoriteKey = channel.id || channel.name;
        const isFavorite = favorites.includes(favoriteKey);
        const item = document.createElement('li');
        item.className = `channel-item${index === currentChannelIdx ? ' active' : ''}`;
        item.tabIndex = 0;
        item.setAttribute('aria-label', `پخش ${channel.name}`);

        const info = document.createElement('div');
        info.className = 'channel-info';
        const title = document.createElement('span');
        title.className = 'channel-title';
        title.textContent = channel.name;
        const meta = document.createElement('div');
        meta.className = 'channel-meta';
        const badge = document.createElement('span');
        badge.className = `badge${channel.isHD ? ' badge-hd' : ''}`;
        badge.textContent = channel.isHD ? 'HD' : (channel.quality && channel.quality !== 'Unknown' ? channel.quality : 'SD');
        const group = document.createElement('span');
        group.textContent = channel.group;
        meta.append(badge, group);
        info.append(title, meta);

        const actions = document.createElement('div');
        actions.className = 'channel-actions';
        const shareButton = createSvgButton('share', 'اشتراک‌گذاری');
        const favoriteButton = createSvgButton('fav', isFavorite ? 'حذف از علاقه‌مندی‌ها' : 'افزودن به علاقه‌مندی‌ها', isFavorite);
        shareButton.addEventListener('click', event => {
          event.stopPropagation();
          shareChannel(channel);
        });
        favoriteButton.addEventListener('click', event => {
          event.stopPropagation();
          toggleFavorite(favoriteKey);
        });
        actions.append(shareButton, favoriteButton);
        item.append(info, actions);
        item.addEventListener('click', () => playChannel(index, true));
        item.addEventListener('keydown', event => {
          if (event.key === 'Enter' || event.key === ' ') {
            event.preventDefault();
            playChannel(index, true);
          }
        });
        channelListEl.appendChild(item);
      });
    }

    function populateGroups() {
      const selected = groupFilter.value;
      groupFilter.replaceChildren();
      const defaultOption = document.createElement('option');
      defaultOption.value = '';
      defaultOption.textContent = 'همهٔ دسته‌ها';
      groupFilter.appendChild(defaultOption);
      [...new Set(channels.map(channel => channel.group).filter(Boolean))].sort().forEach(value => {
        const option = document.createElement('option');
        option.value = value;
        option.textContent = value;
        groupFilter.appendChild(option);
      });
      if ([...groupFilter.options].some(option => option.value === selected)) groupFilter.value = selected;
    }

    function toggleFavorite(id) {
      favorites = favorites.includes(id) ? favorites.filter(item => item !== id) : [...favorites, id];
      try {
        localStorage.setItem('iptv_favorites', JSON.stringify(favorites));
      } catch (_) {
        showToast('ذخیرهٔ علاقه‌مندی‌ها در این مرورگر ممکن نیست.');
      }
      renderChannels();
    }

    async function copyText(value) {
      if (navigator.clipboard && window.isSecureContext) {
        await navigator.clipboard.writeText(value);
        return true;
      }
      const input = document.createElement('textarea');
      input.value = value;
      input.setAttribute('readonly', '');
      input.style.position = 'fixed';
      input.style.opacity = '0';
      document.body.appendChild(input);
      input.select();
      let copied = false;
      try { copied = document.execCommand('copy'); } catch (_) {}
      input.remove();
      return copied;
    }

    async function shareChannel(channel) {
      const shareUrl = new URL(window.location.href);
      shareUrl.searchParams.set('channel', channel.id || channel.name);
      if (currentSourceUrl) shareUrl.searchParams.set('url', currentSourceUrl);
      try {
        const copied = await copyText(shareUrl.toString());
        showToast(copied ? `پیوند ${channel.name} کپی شد.` : 'کپی خودکار در این مرورگر در دسترس نیست.');
      } catch (_) {
        showToast('کپی پیوند انجام نشد؛ دسترسی Clipboard را بررسی کنید.');
      }
    }

    function updateUrlState(channel) {
      const url = new URL(window.location.href);
      url.searchParams.set('channel', channel.id || channel.name);
      if (currentSourceUrl) url.searchParams.set('url', currentSourceUrl);
      else url.searchParams.delete('url');
      window.history.replaceState({}, '', url);
    }

    function stopCurrentStream() {
      if (hls) {
        try { hls.destroy(); } catch (_) {}
        hls = null;
      }
      video.onerror = null;
      video.onloadedmetadata = null;
      resetQualityControl('برای کانال فعلی کیفیتی بارگذاری نشده است.');
      video.pause();
      video.removeAttribute('src');
      video.load();
    }

    function playChannel(index, updateHistory = false, playbackEntry = null) {
      if (index < 0 || index >= channels.length) return;
      currentChannelIdx = index;
      const channel = playbackEntry || channels[index];
      currentPlaybackEntry = channel;
      hideOverlays();
      stopCurrentStream();
      nowPlayingTitle.textContent = channel.name;
      setStatus('buffering');
      renderChannels();
      if (updateHistory) updateUrlState(channel);

      const HlsPlayer = window.Hls;
      if (HlsPlayer && typeof HlsPlayer.isSupported === 'function' && HlsPlayer.isSupported()) {
        resetQualityControl('در حال دریافت کیفیت‌های موجود…');
        const instance = new HlsPlayer({
          enableWorker: true,
          lowLatencyMode: true,
          backBufferLength: 60,
          manifestLoadingMaxRetry: 2,
          levelLoadingMaxRetry: 2
        });
        hls = instance;
        instance.on(HlsPlayer.Events.MANIFEST_PARSED, () => {
          if (hls !== instance) return;
          updateQualityOptions(instance);
          video.play().catch(() => {});
        });
        if (HlsPlayer.Events.LEVELS_UPDATED) {
          instance.on(HlsPlayer.Events.LEVELS_UPDATED, () => updateQualityOptions(instance));
        }
        if (HlsPlayer.Events.LEVEL_SWITCHED) {
          instance.on(HlsPlayer.Events.LEVEL_SWITCHED, (_, data) => updateCurrentQuality(instance, data));
        }
        instance.on(HlsPlayer.Events.ERROR, (_, data) => {
          if (!data.fatal || hls !== instance) return;
          if (!isAutoRetrying) {
            startAutoRetryCountdown();
            if (data.type === HlsPlayer.ErrorTypes.NETWORK_ERROR) {
              try { instance.startLoad(); } catch (_) {}
            } else if (data.type === HlsPlayer.ErrorTypes.MEDIA_ERROR) {
              try { instance.recoverMediaError(); } catch (_) {}
            }
          }
        });
        instance.loadSource(channel.url);
        instance.attachMedia(video);
      } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
        updateNativeQualityOptions();
        video.src = channel.url;
        video.onloadedmetadata = () => video.play().catch(() => {});
        video.onerror = () => {
          if (!isAutoRetrying) startAutoRetryCountdown();
        };
      } else {
        resetQualityControl('این مرورگر برای این استریم گزینهٔ کیفیت ندارد.', 'در دسترس نیست');
        showManualRetry('این مرورگر پخش HLS را پشتیبانی نمی‌کند. مرورگر دیگری را امتحان کنید.');
      }
    }

    video.addEventListener('playing', () => {
      hideOverlays();
      setStatus('online');
    });
    retryBtn.addEventListener('click', () => {
      if (currentChannelIdx >= 0) playChannel(currentChannelIdx, false, currentPlaybackEntry);
    });

    async function loadFromUrl(url, targetChannelName = null) {
      const playlistUrl = resolveHttpUrl(url, window.location.href);
      if (!playlistUrl) {
        showToast('نشانی پلی‌لیست معتبر نیست؛ فقط HTTP یا HTTPS مجاز است.');
        return;
      }
      currentSourceUrl = url;
      channels = [];
      currentChannelIdx = -1;
      currentPlaybackEntry = null;
      stopCurrentStream();
      hideOverlays();
      populateGroups();
      renderChannels();
      setStatus('buffering');
      showToast('در حال بارگذاری فهرست...');

      try {
        const response = await fetch(playlistUrl, { cache: 'no-cache' });
        if (!response.ok) throw new Error(`HTTP ${response.status}`);
        const text = await response.text();
        const parsed = parseM3U(text, playlistUrl);
        if (parsed.length === 0) throw new Error('در این فهرست کانال قابل پخشی پیدا نشد.');
        channels = parsed;
        populateGroups();
        renderChannels();

        const target = targetChannelName ? targetChannelName.toLowerCase() : '';
        const targetIndex = target ? channels.findIndex(channel =>
          channel.name.toLowerCase() === target || channel.id.toLowerCase() === target
        ) : -1;
        playChannel(targetIndex >= 0 ? targetIndex : 0);
        showToast(`فهرست با ${channels.length} شبکه آماده شد.`);
      } catch (error) {
        channels = [];
        populateGroups();
        renderChannels();
        setStatus('error');
        showToast(`بارگذاری فهرست ناموفق بود: ${error.message}`);
      }
    }

    sourceSelector.addEventListener('change', () => {
      if (sourceSelector.value === 'custom') {
        urlLoader.style.display = 'inline-block';
        urlLoader.focus();
      } else {
        urlLoader.style.display = 'none';
        loadFromUrl(sourceSelector.value);
      }
    });

    document.getElementById('btn-load-url').addEventListener('click', () => {
      const targetUrl = sourceSelector.value === 'custom' ? urlLoader.value.trim() : sourceSelector.value;
      if (targetUrl) loadFromUrl(targetUrl);
    });
    urlLoader.addEventListener('keydown', event => {
      if (event.key === 'Enter') {
        event.preventDefault();
        loadFromUrl(urlLoader.value.trim());
      }
    });

    document.getElementById('file-loader').addEventListener('change', event => {
      const file = event.target.files && event.target.files[0];
      if (!file) return;
      currentSourceUrl = '';
      currentPlaybackEntry = null;
      const reader = new FileReader();
      reader.onload = loadEvent => {
        channels = parseM3U(loadEvent.target.result);
        currentChannelIdx = -1;
        stopCurrentStream();
        populateGroups();
        renderChannels();
        if (channels.length > 0) {
          playChannel(0);
          showToast(`فایل با ${channels.length} شبکه بارگذاری شد.`);
        } else {
          showToast('در فایل، پیوند HTTP(S) قابل پخشی پیدا نشد.');
        }
      };
      reader.onerror = () => showToast('خواندن فایل ناموفق بود.');
      reader.readAsText(file);
      event.target.value = '';
    });

    document.querySelectorAll('.tab-btn').forEach(button => {
      button.addEventListener('click', () => {
        document.querySelectorAll('.tab-btn').forEach(item => item.classList.remove('active'));
        button.classList.add('active');
        activeTab = button.dataset.tab;
        renderChannels();
      });
    });
    searchInput.addEventListener('input', renderChannels);
    groupFilter.addEventListener('change', renderChannels);

    document.addEventListener('keydown', event => {
      if (event.altKey || event.ctrlKey || event.metaKey) return;
      if (event.target.closest && event.target.closest('input, select, textarea, button, [contenteditable="true"]')) return;
      const key = event.key.toLowerCase();
      if (key === 'f') {
        event.preventDefault();
        if (document.fullscreenElement) document.exitFullscreen().catch(() => {});
        else if (video.requestFullscreen) video.requestFullscreen().catch(() => {});
      } else if (key === 'm') {
        video.muted = !video.muted;
      } else if (key === 'n' && currentChannelIdx < channels.length - 1) {
        playChannel(currentChannelIdx + 1, true);
      } else if (key === 'p' && currentChannelIdx > 0) {
        playChannel(currentChannelIdx - 1, true);
      }
    });

    window.addEventListener('DOMContentLoaded', () => {
      const params = new URLSearchParams(window.location.search);
      const deepLinkUrl = params.get('url');
      const deepLinkChannel = params.get('channel');
      const initialSource = deepLinkUrl || sourceSelector.value;
      if (deepLinkUrl) {
        sourceSelector.value = 'custom';
        urlLoader.style.display = 'inline-block';
        urlLoader.value = deepLinkUrl;
      }
      loadFromUrl(initialSource, deepLinkChannel);
    });
  </script>
</body>
</html>
