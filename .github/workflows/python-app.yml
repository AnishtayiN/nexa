name: Build Nexa playlists

on:
  push:
    branches: [main]
    paths:
      - 'iptv_builder.py'
      - 'tests/**'
      - 'requirements.txt'
      - '.github/workflows/python-app.yml'
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nexa-playlist-update
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run tests
        run: python -m unittest discover -s tests -v

      - name: Generate playlists
        run: python iptv_builder.py

      - name: Validate generated files
        run: |
          python - <<'PY'
          from pathlib import Path

          required = {
              'playlist.m3u': True,
              'playlist_hd.m3u': False,
              'playlist_sd.m3u': False,
              'playlist_extended.m3u': True,
              'playlist_extended_hd.m3u': False,
              'playlist_extended_sd.m3u': False,
          }
          for name, must_have_channels in required.items():
              path = Path(name)
              if not path.is_file():
                  raise SystemExit(f'MISSING: {name}')
              lines = path.read_text(encoding='utf-8-sig').splitlines()
              if not lines or lines[0].strip() != '#EXTM3U':
                  raise SystemExit(f'INVALID HEADER: {name}')
              count = sum(line.startswith('#EXTINF:') for line in lines)
              if must_have_channels and count == 0:
                  raise SystemExit(f'EMPTY: {name}')
              print(f'OK: {name} ({count} streams)')
          PY

      - name: Commit and push playlist updates
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- playlist*.m3u
          if git diff --cached --quiet; then
            echo 'No playlist changes to commit.'
            exit 0
          fi
          git commit -m 'Auto-update IPTV playlists [skip ci]'
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
