name: Update IPTV Playlist

on:
  push:
    paths:
      - 'iptv_builder.py'
      - '.github/workflows/**'
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: iptv-playlist-update
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run script
        run: python iptv_builder.py

      - name: Verify output
        run: |
          if [ -f playlist.m3u ]; then
            echo "OK: playlist.m3u ($(wc -l < playlist.m3u) lines)"
          else
            echo "MISSING: playlist.m3u"
            exit 1
          fi

      - name: Commit and Push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add playlist.m3u 2>/dev/null || true

          if git diff --cached --quiet; then
            echo "تغییری وجود ندارد؛ commit لازم نیست."
            exit 0
          fi

          git commit -m "Auto-update playlist [skip ci]"
          git pull --rebase --autostash origin "${GITHUB_REF_NAME}" || true
          git push origin "HEAD:${GITHUB_REF_NAME}"
